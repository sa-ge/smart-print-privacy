      --border:#273136; --accent:#3ddc97; --accent-2:#2fbf80; --accent-bg:#12261f;

    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{

  .wrap{ max-width:1060px; margin:0 auto; padding-inline:16px; }

  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .brand img{ width:48px; height:48px; flex:none; border-radius:12px; }
  .brand-name{ font-weight:800; font-size:16px; line-height:1.3; }
  .brand-sub{ font-size:12px; color:var(--text-2); line-height:1.3; }
  .lang-btn{
    min-width:42px; height:36px; padding:0 12px; flex:none;
    border:1px solid var(--border); border-radius:10px;
    background:var(--panel); color:var(--text); cursor:pointer;
    font:700 13px/1 'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
    transition:border-color .15s, color .15s;
  }
  .lang-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .lang-btn.to-ar{ font-size:17px; }

  .intro{ text-align:center; padding-block:clamp(22px,5vw,44px) 4px; }
  .intro h1{ margin:0 0 12px; font-size:clamp(28px,5.5vw,44px); font-weight:800; line-height:1.25; }
  .intro p{ margin:0 auto; max-width:620px; color:var(--text-2); font-size:clamp(15px,2.4vw,17px); line-height:1.9; }

  .picker-label{ font-size:14px; font-weight:700; color:var(--text-2); }
  .seg{ display:inline-flex; padding:5px; gap:4px; border-radius:14px; background:var(--panel); border:1px solid var(--border); box-shadow:var(--shadow); }
  .seg button{
    border:0; background:transparent; color:var(--text-2); cursor:pointer;
    font:700 15px/1 'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
    min-width:46px; padding:11px 16px; border-radius:10px;
    transition:background .15s, color .15s;
  }
  .seg button[aria-pressed="true"]{ background:var(--accent); color:var(--on-accent); }
  .seg button:hover:not([aria-pressed="true"]){ color:var(--accent); }

  /* ── البطاقات الثلاث ── */

  .plan{
    position:relative; background:var(--panel); border:1px solid var(--border); border-radius:18px;
    padding:28px 24px 24px; display:flex; flex-direction:column; box-shadow:var(--shadow);
  }
  .plan.rec{ border:2px solid var(--accent); }
  .rec-badge{
    position:absolute; top:-14px; inset-inline-start:50%; transform:translateX(-50%);
    background:var(--accent); color:var(--on-accent); font-size:12px; font-weight:800;
    padding:4px 14px; border-radius:999px; white-space:nowrap;
  }

  .plan-name{ font-size:20px; font-weight:800; margin:0 0 4px; line-height:1.3; }
  .plan-sub{ font-size:13px; color:var(--text-2); line-height:1.7; min-height:44px; }
  .price-block{ padding-block:14px 16px; border-block:1px dashed var(--border); margin:12px 0 16px; min-height:164px; }
  .price{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .price-num{ font-size:48px; font-weight:800; line-height:1; letter-spacing:-.5px; }
  .price-cur{ font-size:16px; font-weight:700; color:var(--text-2); }

  .price-per b{ color:var(--accent); font-weight:700; }
  .save-chip{ display:inline-block; font-size:12px; font-weight:700; color:var(--accent); background:var(--accent-bg); padding:3px 10px; border-radius:999px; margin-top:10px; }

  .feat li.plus b{ color:var(--accent); }
  .vat{ text-align:center; color:var(--text-2); font-size:12.5px; margin:22px 0 0; }

  /* ── الأقسام ── */
  section{ margin-top:56px; }
  h2{ font-size:24px; font-weight:800; margin:0 0 6px; text-align:center; }
  .sec-sub{ color:var(--text-2); font-size:14.5px; margin:0 auto 24px; line-height:1.8; text-align:center; max-width:620px; }

  .plan-ico{ width:44px; height:44px; border-radius:12px; flex:none; background:var(--accent-bg); color:var(--accent); display:grid; place-items:center; }
  .plan-ico svg{ width:24px; height:24px; }
  .grid3{ display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px; }

  .card h3{ margin:0 0 6px; font-size:16px; font-weight:700; }
  .card p{ margin:0; font-size:13.5px; line-height:1.8; color:var(--text-2); }

  .faq .ans a{ color:var(--accent); font-weight:600; text-decoration:none; }

  .contact-links svg{ width:22px; height:22px; flex:none; color:var(--accent); }

  footer a{ color:var(--accent); text-decoration:none; font-weight:600; }
  footer a:hover{ text-decoration:underline; }
  [hidden]{ display:none !important; }
</style>

      cta: "यह प्लान ऑर्डर करें", note: "सदस्यता से पहले प्रिंटिंग 7 दिन मुफ़्त आज़माएँ",
      plus: function (k) { var c = PL[k]; return [(c.n === 1 ? "1 WhatsApp नंबर" : "2 WhatsApp नंबर"), "{d} कंप्यूटर तक".replace('{d}', c.d), "सदस्यता के दौरान अपडेट और सहायता"]; },
      msg: function (k, y) { return "नमस्ते, मैं WA WEB PLUS की सदस्यता लेना चाहता/चाहती हूँ: {name} प्लान - {period}।".replace('{name}', X.hi[k].name).replace('{period}', y ? "वार्षिक" : "मासिक"); },
      faqPlans: ["बेसिक और बिज़नेस में क्या अंतर है?","सुविधाएँ वही हैं। बेसिक में 1 WhatsApp नंबर और 3 कंप्यूटर तक; बिज़नेस में 2 नंबर और 6 कंप्यूटर तक। मासिक भुगतान करें, या छूट के साथ वार्षिक।"],
      faqMore: ["2 से अधिक नंबर या 6 से अधिक कंप्यूटर चाहिए?","WhatsApp पर हमें लिखें, हम कोटेशन भेजेंगे।"] },
    zh: { devLabel: "计费方式", mo: "按月", yr: "按年", perM: "每月", perY: "每年", eq: "约合", perMonth: "USD / 月",
      save: function (n, p) { return "比按月付费节省 {n} USD（{p}%）".replace('{n}', n).replace('{p}', p); },
      b: {"name":"基础版","sub":"适用于只有一个 WhatsApp 号码的店铺。"}, p: {"name":"商业版","sub":"适用于两个 WhatsApp 号码或多家分店。","rec":"最适合店铺"},
      cta: "订购此方案", note: "订阅前可免费试用打印 7 天",
      plus: function (k) { var c = PL[k]; return [(c.n === 1 ? "1 个 WhatsApp 号码" : "2 个 WhatsApp 号码"), "最多 {d} 台电脑".replace('{d}', c.d), "订阅期内的更新和支持"]; },
      msg: function (k, y) { return "你好，我想订阅 WA WEB PLUS：{name}方案 - {period}。".replace('{name}', X.zh[k].name).replace('{period}', y ? "按年" : "按月"); },
      faqPlans: ["基础版和商业版有什么区别？","功能相同。基础版涵盖 1 个 WhatsApp 号码和最多 3 台电脑；商业版涵盖 2 个号码和最多 6 台电脑。可按月付费，或按年付费享折扣。"],
      faqMore: ["需要超过 2 个号码或 6 台电脑？","请通过 WhatsApp 联系我们，我们会发送报价。"] },
    ur: { devLabel: "بلنگ", mo: "ماہانہ", yr: "سالانہ", perM: "فی ماہ", perY: "فی سال", eq: "تقریباً", perMonth: "USD / ماہ",
      save: function (n, p) { return "ماہانہ کے مقابلے میں {n} USD ({p}٪) بچائیں".replace('{n}', n).replace('{p}', p); },
      b: {"name":"بنیادی","sub":"ایک واٹس ایپ نمبر والی دکان کے لیے۔"}, p: {"name":"بزنس","sub":"دو واٹس ایپ نمبرز یا ایک سے زیادہ شاخوں کے لیے۔","rec":"دکانوں کے لیے بہترین"},
      cta: "یہ پلان آرڈر کریں", note: "سبسکرپشن سے پہلے پرنٹنگ 7 دن مفت آزمائیں",
      plus: function (k) { var c = PL[k]; return [(c.n === 1 ? "1 واٹس ایپ نمبر" : "2 واٹس ایپ نمبرز"), "{d} کمپیوٹرز تک".replace('{d}', c.d), "سبسکرپشن کے دوران اپ ڈیٹس اور سپورٹ"]; },
      msg: function (k, y) { return "السلام علیکم، میں WA WEB PLUS کی سبسکرپشن لینا چاہتا/چاہتی ہوں: {name} پلان - {period}۔".replace('{name}', X.ur[k].name).replace('{period}', y ? "سالانہ" : "ماہانہ"); },
      faqPlans: ["بنیادی اور بزنس میں کیا فرق ہے؟","خصوصیات وہی ہیں۔ بنیادی میں 1 واٹس ایپ نمبر اور 3 کمپیوٹرز تک؛ بزنس میں 2 نمبرز اور 6 کمپیوٹرز تک۔ ماہانہ ادائیگی کریں، یا رعایت کے ساتھ سالانہ۔"],
      faqMore: ["2 سے زیادہ نمبرز یا 6 سے زیادہ کمپیوٹرز چاہییں؟","واٹس ایپ پر ہمیں لکھیں، ہم کوٹیشن بھیجیں گے۔"] }
  };
  ['ar', 'en', 'es', 'fr', 'tr', 'pt', 'id', 'de', 'hi', 'zh', 'ur'].forEach(function (l) {
    var t = T[l], x = X[l]; t.devLabel = x.devLabel; t.perMonth = x.perMonth;
    if (t.why[0].length === 2) t.why = t.why.map(function (w, i) { return [[ICON_SHIELD, ICON_BOLT, ICON_HEAD][i], w[0], w[1]]; });   // اللغات المضافة: العنوان والنص فقط، والأيقونات مشتركة
    t.faq = t.faq.map(function (q, i) { return i === 2 ? x.faqPlans : q; });
    t.faq[t.faq.length - 1] = x.faqMore;
  });


  var KEY = 'privacy_lang';
  var LANGS = ['ar', 'en', 'es', 'fr', 'tr', 'pt', 'id', 'de', 'hi', 'zh', 'ur'];
  var RTL = { ar: 1, ur: 1 };
  var lang = pick(), yearly = false;

  function pick() {
    var q = /[?&]lang=([a-z]{2})\b/.exec(location.search);
    if (q && LANGS.indexOf(q[1]) < 0) q = null;
    if (q) return q[1];
    try { var s = localStorage.getItem(KEY); if (LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var nl = navigator.language || '';
    for (var i = 0; i < LANGS.length; i++) if (new RegExp('^' + LANGS[i] + '\\b', 'i').test(nl)) return LANGS[i];
    return 'en';
  }
  function fmt(x) { return (Math.round(x * 10) / 10).toString(); }
  function waUrl(text) { return 'https://wa.me/' + PHONE + '?text=' + encodeURIComponent(text); }
  
  function li(cls, inner) { return '<li' + (cls ? ' class="' + cls + '"' : '') + '>' + CHECK + '<span>' + inner + '</span></li>'; }

  function featuresHtml(t, plus, list, head) {
    var top = plus.map(function (p) { return li('plus', '<b>' + p + '</b>'); }).join('');
    var all = list.map(function (f) { return li('', '<b>' + f[0] + '</b> — <span class="why">' + f[1] + '</span>'); }).join('');
    return '<div class="feat-head">' + t.plusHead + '</div><ul class="feat">' + top + '</ul>' +
           '<div class="feat-head">' + head + '</div><ul class="feat">' + all + '</ul>';
  }

  function paidCard(t, k) {
    var x = X[lang], c = PL[k], rec = k === 'p', price = yearly ? c.y : c.m, full = c.m * 12, saving = full - c.y;
    return '<div class="plan' + (rec ? ' rec' : '') + '">' +
      (rec ? '<span class="rec-badge">' + x.p.rec + '</span>' : '') +
      '<h3 class="plan-name">' + x[k].name + '</h3><div class="plan-sub">' + x[k].sub + '</div>' +
      '<div class="price-block"><div class="price"><span class="price-num">' + price + '</span><span class="price-cur">' + t.cur + '</span>' +
      (yearly ? '<span class="price-old">' + full + '</span>' : '') + '</div>' +
      '<div class="price-per"><div>' + (yearly ? x.perY : x.perM) + '</div>' +
      (yearly ? '<div>' + x.eq + ' <b>' + fmt(price / 12) + '</b> ' + t.perMonth + '</div>' : '') + '</div>' +
      (yearly ? '<span class="save-chip">' + x.save(saving, Math.round(saving / full * 100)) + '</span>' : '') + '</div>' +
      '<a class="cta' + (rec ? '' : ' alt') + '" target="_blank" rel="noopener" href="' + waUrl(x.msg(k, yearly)) + '">' + WA + '<span>' + x.cta + '</span></a>' +
      '<p class="trial-note">' + x.note + '</p>' +
      featuresHtml(t, [t.allFree].concat(x.plus(k)), t.feats, t.featPaid) +
      '</div>';
  }

  function trialCard(t) {
    var P = t.p0, href = STORE_URL ? STORE_URL + '?hl=' + lang : waUrl(P.msg);
    return '<div class="plan">' +
      '<h3 class="plan-name">' + P.name + '</h3><div class="plan-sub">' + P.sub + '</div>' +
      '<div class="price-block"><div class="price"><span class="price-num">0</span><span class="price-cur">' + t.cur + '</span></div>' +
      '<div class="price-per"><div>' + P.price + '</div><div>' + P.per + '</div></div></div>' +
      '<a class="cta alt" target="_blank" rel="noopener" href="' + href + '">' + (STORE_URL ? '' : WA) + '<span>' + (STORE_URL ? P.ctaStore : P.cta) + '</span></a>' +
      '<p class="trial-note">' + P.note + '</p>' +
      featuresHtml(t, t.trialPlus, t.freeFeats, t.featFree) +
      '</div>';
  }

  function render() {
    var t = T[lang], ar = lang === 'ar';
    document.documentElement.lang = lang;
    document.documentElement.dir = RTL[lang] ? 'rtl' : 'ltr';
    document.title = t.title;

    var els = document.querySelectorAll('[data-t]');
    for (var i = 0; i < els.length; i++) els[i].textContent = t[els[i].getAttribute('data-t')];

    var btn = document.getElementById('lang-btn');
    btn.value = lang;
    btn.className = 'lang-btn' + (ar ? ' to-ar' : '');

    var seg = document.getElementById('devs');
    seg.textContent = '';
    [false, true].forEach(function (y) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = y ? X[lang].yr : X[lang].mo;
      b.setAttribute('aria-pressed', y === yearly ? 'true' : 'false');
      b.addEventListener('click', function () { yearly = y; render(); });
      seg.appendChild(b);
    });

    document.getElementById('plans').innerHTML = trialCard(t) + paidCard(t, 'b') + paidCard(t, 'p');

    document.getElementById('why').innerHTML = t.why.map(function (w) {
      return '<div class="card"><div class="plan-ico">' + w[0] + '</div><h3>' + w[1] + '</h3><p>' + w[2] + '</p></div>';
    }).join('');

    document.getElementById('faq').innerHTML = t.faq.map(function (q, i) {
      return '<details' + (i === 0 ? ' open' : '') + '><summary>' + q[0] + '</summary><div class="ans">' + q[1] + '</div></details>';
    }).join('');

    var pls = document.querySelectorAll('a[data-privacy]');
    for (var j = 0; j < pls.length; j++) pls[j].href = './?lang=' + lang;

    document.getElementById('wa-link').href = waUrl(t.waAsk);
    var pl = document.getElementById('privacy-link');
    pl.textContent = t.privacy;
    pl.href = './?lang=' + lang;
  }

  document.getElementById('lang-btn').addEventListener('change', function () {
    lang = LANGS.indexOf(this.value) >= 0 ? this.value : 'en';
    try { localStorage.setItem(KEY, lang); } catch (e) {}
    render();
  });
  render();
})();
</script>
