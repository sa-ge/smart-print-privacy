<!doctype html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الأسعار - مساعد الطباعة الذكي</title>

<style>
  :root{
    --bg:#f4f7f6; --panel:#ffffff; --text:#14232b; --text-2:#5a6a72;
    --border:#e1e8e6; --accent:#0f8a5f; --accent-2:#0b6b4a; --accent-bg:#e6f5ee;
    --on-accent:#ffffff; --shadow:0 1px 2px rgba(20,35,43,.05), 0 8px 28px rgba(20,35,43,.07);
    --hero-a:#0f8a5f; --hero-b:#0a5e8a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1315; --panel:#161d20; --text:#eef3f4; --text-2:#9bacb3;
      --border:#273136; --accent:#3ddc97; --accent-2:#2fbf80; --accent-bg:#12261f;
      --on-accent:#06241a; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
      --hero-a:#0c5a41; --hero-b:#0b3b57;
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:1020px; margin:0 auto; padding-inline:16px; }

  /* ── الشريط العلوي ── */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:18px; }
  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .brand img{ width:44px; height:44px; flex:none; }
  .brand-name{ font-weight:800; font-size:16px; line-height:1.3; }
  .brand-sub{ font-size:12px; color:var(--text-2); line-height:1.3; }
  .lang-btn{
    min-width:42px; height:36px; padding:0 12px; flex:none;
    border:1px solid var(--border); border-radius:10px;
    background:var(--panel); color:var(--text); cursor:pointer;
    font:700 13px/1 'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
    transition:border-color .15s, color .15s;
  }
  .lang-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .lang-btn.to-ar{ font-size:17px; }

  /* ── العنوان الرئيسي (بسيط وواضح) ── */
  .intro{ text-align:center; padding-block:clamp(22px,5vw,44px) 4px; }
  .intro h1{ margin:0 0 12px; font-size:clamp(28px,5.5vw,44px); font-weight:800; line-height:1.25; }
  .intro p{ margin:0 auto; max-width:620px; color:var(--text-2); font-size:clamp(15px,2.4vw,17px); line-height:1.9; }
  .trial-pill{
    display:inline-flex; align-items:center; gap:8px; margin-top:18px;
    background:var(--accent-bg); color:var(--accent); border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
    padding:8px 16px; border-radius:999px; font-size:14px; font-weight:700;
  }

  /* ── مبدّل المدة ── */
  .toggle-row{ display:flex; justify-content:center; margin:30px 0 24px; }
  .toggle{ display:inline-flex; padding:5px; gap:4px; border-radius:14px; background:var(--panel); border:1px solid var(--border); box-shadow:var(--shadow); }
  .toggle button{
    border:0; background:transparent; color:var(--text-2); cursor:pointer;
    font:700 14.5px/1 'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
    padding:11px 22px; border-radius:10px; display:flex; align-items:center; gap:8px;
    transition:background .15s, color .15s;
  }
  .toggle button[aria-pressed="true"]{ background:var(--accent); color:var(--on-accent); }
  .toggle .tag{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--accent-bg); color:var(--accent); }
  .toggle button[aria-pressed="true"] .tag{ background:rgba(255,255,255,.22); color:inherit; }

  /* ── البطاقات ── */
  .plans{ display:flex; flex-wrap:wrap; justify-content:center; gap:18px; align-items:stretch; padding-top:14px; }
  .plan{
    position:relative; flex:1 1 270px; max-width:324px;
    background:var(--panel); border:1px solid var(--border); border-radius:18px;
    padding:26px 24px 24px; display:flex; flex-direction:column; box-shadow:var(--shadow);
    transition:transform .18s, border-color .18s;
  }
  .plan:hover{ transform:translateY(-3px); border-color:var(--accent); }
  .plan.rec{ border:2px solid var(--accent); }
  .rec-badge{
    position:absolute; top:-14px; inset-inline-start:50%; transform:translateX(-50%);
    background:var(--accent); color:var(--on-accent); font-size:12px; font-weight:800;
    padding:4px 14px; border-radius:999px; white-space:nowrap;
  }
  [dir="rtl"] .rec-badge{ transform:translateX(50%); }
  .plan-head{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .plan-ico{ width:44px; height:44px; border-radius:12px; flex:none; background:var(--accent-bg); color:var(--accent); display:grid; place-items:center; }
  .plan-ico svg{ width:24px; height:24px; }
  .plan-name{ font-size:19px; font-weight:800; margin:0; line-height:1.3; }
  .plan-sub{ font-size:12.5px; color:var(--text-2); }
  .price-block{ padding-block:14px 16px; border-top:1px dashed var(--border); margin-bottom:16px; flex:1; }
  .price{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .price-num{ font-size:48px; font-weight:800; line-height:1; letter-spacing:-.5px; }
  .price-cur{ font-size:16px; font-weight:700; color:var(--text-2); }
  .price-old{ font-size:16px; font-weight:600; color:var(--text-2); text-decoration:line-through; }
  .price-per{ font-size:13px; color:var(--text-2); margin-top:8px; line-height:1.9; }
  .price-per b{ color:var(--accent); font-weight:700; }
  .save-chip{ display:inline-block; font-size:12px; font-weight:700; color:var(--accent); background:var(--accent-bg); padding:3px 10px; border-radius:999px; margin-top:10px; }
  .cta{
    display:flex; align-items:center; justify-content:center; gap:9px;
    text-decoration:none; font-weight:700; font-size:15px;
    padding:13px 18px; border-radius:12px;
    background:var(--accent); color:var(--on-accent);
    transition:background .15s;
  }
  .cta:hover{ background:var(--accent-2); }
  .cta svg{ width:20px; height:20px; }
  .trial-note{ text-align:center; color:var(--text-2); font-size:12.5px; margin:10px 0 0; }
  .vat{ text-align:center; color:var(--text-2); font-size:12.5px; margin:20px 0 0; }

  /* ── الأقسام ── */
  section{ margin-top:52px; }
  h2{ font-size:24px; font-weight:800; margin:0 0 6px; text-align:center; }
  .sec-sub{ color:var(--text-2); font-size:14.5px; margin:0 auto 24px; line-height:1.8; text-align:center; max-width:620px; }

  /* ما يتضمنه كل اشتراك: «ميزة — فائدتها» في بطاقة واحدة بدل تكرارها في كل باقة */
  .incl{
    background:var(--panel); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow);
    padding:clamp(20px,4vw,32px);
  }
  .incl-grid{ list-style:none; margin:0; padding:0; display:grid; gap:16px 28px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
  .incl-grid li{ display:flex; gap:12px; align-items:flex-start; font-size:14.5px; line-height:1.75; }
  .incl-grid svg{ width:20px; height:20px; flex:none; margin-top:4px; color:var(--accent); }
  .incl-grid b{ font-weight:700; }
  .incl-grid span span{ color:var(--text-2); }

  .grid3{ display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px; }
  .card .plan-ico{ margin-bottom:12px; }
  .card h3{ margin:0 0 6px; font-size:16px; font-weight:700; }
  .card p{ margin:0; font-size:13.5px; line-height:1.8; color:var(--text-2); }

  /* الأسئلة الشائعة */
  .faq{ max-width:760px; margin-inline:auto; display:flex; flex-direction:column; gap:10px; }
  .faq details{ background:var(--panel); border:1px solid var(--border); border-radius:14px; }
  .faq details[open]{ border-color:var(--accent); }
  .faq summary{
    list-style:none; cursor:pointer; padding:15px 18px; font-weight:700; font-size:15px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .faq summary::-webkit-details-marker{ display:none; }
  .faq summary::after{ content:"+"; flex:none; font-size:22px; font-weight:600; color:var(--accent); line-height:1; }
  .faq details[open] summary::after{ content:"−"; }
  .faq .ans{ padding:0 18px 16px; color:var(--text-2); font-size:14px; line-height:1.9; }
  .faq .ans a{ color:var(--accent); font-weight:600; text-decoration:none; }
  .faq .ans a:hover{ text-decoration:underline; }

  .contact-box{
    background:var(--panel); border:1px solid var(--border); border-radius:18px;
    padding:clamp(22px,4vw,34px); box-shadow:var(--shadow);
    display:grid; gap:22px; grid-template-columns:1.2fr 1fr; align-items:center;
  }
  @media (max-width:700px){ .contact-box{ grid-template-columns:1fr; } }
  .contact-box h2{ margin-bottom:8px; text-align:start; }
  .contact-box p{ margin:0; color:var(--text-2); font-size:14px; line-height:1.9; }
  .contact-links{ display:flex; flex-direction:column; gap:10px; }
  .contact-links a{
    display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--text);
    border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-weight:600; font-size:14.5px;
    transition:border-color .15s, color .15s;
  }
  .contact-links a:hover{ border-color:var(--accent); color:var(--accent); }
  .contact-links svg{ width:22px; height:22px; flex:none; color:var(--accent); }
  .ltr{ direction:ltr; unicode-bidi:embed; }

  footer{ margin-top:52px; padding-block:26px 40px; border-top:1px solid var(--border); text-align:center; color:var(--text-2); font-size:13px; line-height:2; }
  footer a{ color:var(--accent); text-decoration:none; font-weight:600; }
  footer a:hover{ text-decoration:underline; }
  [hidden]{ display:none !important; }
</style>
</head>

  var KEY = 'privacy_lang';
  var lang = pick(), period = 12;

  function pick() {
    var q = /[?&]lang=(ar|en)\b/.exec(location.search);
    if (q) return q[1];
    try { var s = localStorage.getItem(KEY); if (s === 'ar' || s === 'en') return s; } catch (e) {}
    return /^ar\b/i.test(navigator.language || '') ? 'ar' : 'en';
  }
  function fmt(x) { return (Math.round(x * 10) / 10).toString(); }
  function waUrl(text) { return 'https://wa.me/' + PHONE + '?text=' + encodeURIComponent(text); }
  function pct(n) { return Math.round((NUM[n][0] * 2 - NUM[n][1]) / (NUM[n][0] * 2) * 100); }
  function maxPct() { var m = 0; for (var n = 1; n <= MAX_N; n++) m = Math.max(m, pct(n)); return m; }

  function render() {
    var t = T[lang], ar = lang === 'ar';
    document.documentElement.lang = lang;
    document.documentElement.dir = ar ? 'rtl' : 'ltr';
    document.title = t.title;

    var els = document.querySelectorAll('[data-t]');
    for (var i = 0; i < els.length; i++) els[i].textContent = t[els[i].getAttribute('data-t')];
    document.getElementById('save-tag').textContent = t.saveTag(maxPct());

    var btn = document.getElementById('lang-btn');
    btn.textContent = ar ? 'EN' : 'ع';
    btn.className = 'lang-btn' + (ar ? '' : ' to-ar');
    btn.setAttribute('aria-label', ar ? 'Switch to English' : 'التبديل إلى العربية');

    document.getElementById('p6').setAttribute('aria-pressed', period === 6);
    document.getElementById('p12').setAttribute('aria-pressed', period === 12);

    var html = '';
    [1, 2, 3, 4, 5].forEach(function (n) {
      var p6 = NUM[n][0], p12 = NUM[n][1];
      var price = period === 12 ? p12 : p6;
      var months = period === 12 ? 12 : 6;
      var saving = p6 * 2 - p12;
      html += '<div class="plan' + (n === MAX_N ? ' rec' : '') + '">' +
        (n === MAX_N ? '<span class="rec-badge">' + t.rec + '</span>' : '') +
        '<div class="plan-head"><div class="plan-ico">' + ICONS[n] + '</div>' +
        '<div><h3 class="plan-name">' + t.plan(n) + '</h3><div class="plan-sub">' + t.planSub(n) + '</div></div></div>' +
        '<div class="price-block"><div class="price"><span class="price-num">' + price + '</span><span class="price-cur">' + t.cur + '</span>' +
        (period === 12 ? '<span class="price-old">' + (p6 * 2) + '</span>' : '') + '</div>' +
        '<div class="price-per"><div>' + (period === 12 ? t.per12 : t.per6) + '</div>' +
        '<div>' + t.monthly + ' <b>' + fmt(price / months) + '</b> ' + t.perMonth + '</div>' +
        (n > 1 ? '<div>' + t.monthly + ' <b>' + fmt(price / months / n) + '</b> ' + t.perDev + '</div>' : '') +
        '<div>' + t.oneCode(n) + '</div></div>' +
        (period === 12 && saving > 0 ? '<span class="save-chip">' + t.save(saving, pct(n)) + '</span>' : '') +
        '</div>' +
        '<a class="cta" target="_blank" rel="noopener" href="' + waUrl(t.msg(n, period)) + '">' + WA + '<span>' + t.cta + '</span></a>' +
        '<p class="trial-note">' + t.trialNote + '</p>' +
        '</div>';
    });
    document.getElementById('plans').innerHTML = html;

    document.getElementById('incl').innerHTML = t.incl.map(function (f) {
      return '<li>' + CHECK + '<span><b>' + f[0] + '</b> — <span>' + f[1] + '</span></span></li>';
    }).join('');

    document.getElementById('why').innerHTML = t.why.map(function (w) {
      return '<div class="card"><div class="plan-ico">' + w[0] + '</div><h3>' + w[1] + '</h3><p>' + w[2] + '</p></div>';
    }).join('');

    document.getElementById('faq').innerHTML = t.faq.map(function (q, i) {
      return '<details' + (i === 0 ? ' open' : '') + '><summary>' + q[0] + '</summary><div class="ans">' + q[1] + '</div></details>';
    }).join('');

    var pls = document.querySelectorAll('a[data-privacy]');
    for (var j = 0; j < pls.length; j++) pls[j].href = './?lang=' + lang;

    document.getElementById('wa-link').href = waUrl(ar ? 'السلام عليكم، أرغب بالاستفسار عن اشتراك مساعد الطباعة الذكي.' : 'Hello, I would like to ask about a Smart Print Assistant subscription.');
    var pl = document.getElementById('privacy-link');
    pl.textContent = t.privacy;
    pl.href = './?lang=' + lang;
  }

  document.getElementById('lang-btn').addEventListener('click', function () {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem(KEY, lang); } catch (e) {}
    render();
  });
  document.getElementById('p6').addEventListener('click', function () { period = 6; render(); });
  document.getElementById('p12').addEventListener('click', function () { period = 12; render(); });
  render();
})();
