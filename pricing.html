  body{

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;

  }
  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .brand img{ width:44px; height:44px; flex:none; }
  .brand-name{ font-weight:800; font-size:16px; line-height:1.3; }
  .brand-sub{ font-size:12px; color:var(--text-2); line-height:1.3; }
  .lang-btn{

    border:1px solid var(--border); border-radius:10px;
    background:var(--panel); color:var(--text); cursor:pointer;
    font:700 13px/1 'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
    transition:border-color .15s, color .15s;
  }
  .lang-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .lang-btn.to-ar{ font-size:17px; }

    text-align:center; box-shadow:var(--shadow);

  .hero::after{ width:260px; height:260px; bottom:-130px; inset-inline-end:-60px; }
  .hero > *{ position:relative; z-index:1; }
  .hero-logo{ width:84px; height:84px; margin:0 auto 14px; display:block; filter:drop-shadow(0 6px 14px rgba(0,0,0,.25)); }

    padding:8px 16px; border-radius:999px; font-size:14px; font-weight:700;

  }

  .toggle{

    background:var(--panel); border:1px solid var(--border); box-shadow:var(--shadow);
  }
  .toggle button{
    border:0; background:transparent; color:var(--text-2); cursor:pointer;
    font:700 14.5px/1 'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
    padding:11px 22px; border-radius:10px; display:flex; align-items:center; gap:8px;
    transition:background .15s, color .15s;
  }
  .toggle button[aria-pressed="true"]{ background:var(--accent); color:var(--on-accent); }
  .toggle .tag{
    font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px;
    background:var(--accent-bg); color:var(--accent);
  }
  .toggle button[aria-pressed="true"] .tag{ background:rgba(255,255,255,.22); color:inherit; }

    display:flex; flex-wrap:wrap; justify-content:center; gap:18px; align-items:stretch;
  }
  .plan{
    flex:1 1 270px; max-width:324px;
    background:var(--panel); border:1px solid var(--border); border-radius:18px;
    padding:26px 24px; display:flex; flex-direction:column; box-shadow:var(--shadow);
    transition:transform .18s, border-color .18s;

  .plan:hover{ transform:translateY(-3px); border-color:var(--accent); }
  .plan-head{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .plan-ico{

    display:grid; place-items:center;

  .plan-sub{ font-size:12.5px; color:var(--text-2); }

  .feat svg{ width:18px; height:18px; flex:none; margin-top:4px; color:var(--accent); }

    background:var(--accent); color:var(--on-accent);

  .cta svg{ width:20px; height:20px; }
  .vat{ text-align:center; color:var(--text-2); font-size:12.5px; margin:16px 0 0; }

  .sec-sub{ color:var(--text-2); font-size:14px; margin:0 0 20px; line-height:1.8; }
  .grid3{ display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  .card{

  }
  footer a{ color:var(--accent); text-decoration:none; font-weight:600; }
  footer a:hover{ text-decoration:underline; }
  [hidden]{ display:none !important; }
</style>

          'Updates and technical support throughout'
        ];
      },
      cta: 'Order this plan',
      msg: function (n, p) {
        return 'Hello, I would like to subscribe to Smart Print Assistant: ' + n + (n === 1 ? ' computer' : ' computers') + ' - ' + (p === 12 ? '1 year' : '6 months') + '.';
      },
      vat: 'Prices are in Saudi riyals (SAR).',
      whyTitle: 'What you get',
      whySub: 'Every plan includes the same features; only the number of computers and the period differ.',
      why: [
        [ICON_SHIELD, 'Your files stay with you', 'Processing and printing happen locally on your computer. Your files and photos are never uploaded to any server.'],
        [ICON_BOLT, 'Fast, direct printing', 'Print photos, PDFs and documents from WhatsApp Web chats in just a few clicks.'],
        [ICON_HEAD, 'Updates and support', 'Continuous updates and support by WhatsApp and email for the whole subscription.']
      ],
      cmpTitle: 'Compare plans',
      cmpSub: 'Total price by number of computers and period.',
      cmpHead: ['Plan', '6 months', '1 year'],
      ctTitle: 'Contact us to subscribe',
      ctText: 'To subscribe, or to get a quote for more computers, message us and we will reply with your subscription code.',
      privacy: 'Privacy Policy'
    }
  };

  var KEY = 'privacy_lang';
  var lang = pick(), period = 12;

  function pick() {
    var q = /[?&]lang=(ar|en)\b/.exec(location.search);
    if (q) return q[1];
    try { var s = localStorage.getItem(KEY); if (s === 'ar' || s === 'en') return s; } catch (e) {}
    return /^ar\b/i.test(navigator.language || '') ? 'ar' : 'en';
  }
  function fmt(x) { return (Math.round(x * 10) / 10).toString(); }
  function waUrl(text) { return 'https://wa.me/' + PHONE + '?text=' + encodeURIComponent(text); }

  function render() {
    var t = T[lang], ar = lang === 'ar';
    document.documentElement.lang = lang;
    document.documentElement.dir = ar ? 'rtl' : 'ltr';
    document.title = t.title;

    var els = document.querySelectorAll('[data-t]');
    for (var i = 0; i < els.length; i++) els[i].textContent = t[els[i].getAttribute('data-t')];

    var btn = document.getElementById('lang-btn');
    btn.textContent = ar ? 'EN' : 'ع';
    btn.className = 'lang-btn' + (ar ? '' : ' to-ar');
    btn.setAttribute('aria-label', ar ? 'Switch to English' : 'التبديل إلى العربية');

    document.getElementById('p6').setAttribute('aria-pressed', period === 6);
    document.getElementById('p12').setAttribute('aria-pressed', period === 12);

    var html = '';
    [1, 2, 3, 4, 5].forEach(function (n) {
      var p6 = NUM[n][0], p12 = NUM[n][1];
      var price = period === 12 ? p12 : p6;
      var months = period === 12 ? 12 : 6;
      var feats = t.feats(n).map(function (f) { return '<li>' + CHECK + '<span>' + f + '</span></li>'; }).join('');
      var saving = p6 * 2 - p12;
      html += '<div class="plan">' +
        '<div class="plan-head"><div class="plan-ico">' + ICONS[n] + '</div>' +
        '<div><h3 class="plan-name">' + t.plan(n) + '</h3><div class="plan-sub">' + t.planSub(n) + '</div></div></div>' +
        '<div class="price-block"><div class="price"><span class="price-num">' + price + '</span><span class="price-cur">' + t.cur + '</span></div>' +
        '<div class="price-per"><span>' + (period === 12 ? t.per12 : t.per6) + '</span>' +
        '<span>' + t.monthly + ' <b>' + fmt(price / months) + '</b> ' + t.perMonth + '</span></div>' +
        (period === 12 && saving > 0 ? '<div style="margin-top:12px"><span class="save-chip">' + t.save(saving) + '</span></div>' : '') +
        '</div>' +
        '<ul class="feat">' + feats + '</ul>' +
        '<a class="cta" target="_blank" rel="noopener" href="' + waUrl(t.msg(n, period)) + '">' + WA + '<span>' + t.cta + '</span></a>' +
        '</div>';
    });
    document.getElementById('plans').innerHTML = html;

    document.getElementById('why').innerHTML = t.why.map(function (w) {
      return '<div class="card"><div class="plan-ico">' + w[0] + '</div><h3>' + w[1] + '</h3><p>' + w[2] + '</p></div>';
    }).join('');

    var rows = '<thead><tr><th>' + t.cmpHead[0] + '</th><th>' + t.cmpHead[1] + '</th><th>' + t.cmpHead[2] + '</th></tr></thead><tbody>';
    [1, 2, 3, 4, 5].forEach(function (n) {
      rows += '<tr><td>' + t.plan(n) + '</td><td><b>' + NUM[n][0] + '</b> ' + t.cur + '</td><td><b>' + NUM[n][1] + '</b> ' + t.cur + '</td></tr>';
    });
    document.getElementById('cmp').innerHTML = rows + '</tbody>';

    document.getElementById('wa-link').href = waUrl(ar ? 'السلام عليكم، أرغب بالاستفسار عن اشتراك مساعد الطباعة الذكي.' : 'Hello, I would like to ask about a Smart Print Assistant subscription.');
    var pl = document.getElementById('privacy-link');
    pl.textContent = t.privacy;
    pl.href = './?lang=' + lang;
  }

  document.getElementById('lang-btn').addEventListener('click', function () {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem(KEY, lang); } catch (e) {}
    render();
  });
  document.getElementById('p6').addEventListener('click', function () { period = 6; render(); });
  document.getElementById('p12').addEventListener('click', function () { period = 12; render(); });
  render();
})();
</script>
</body>
</html>
