  html{scroll-behavior:smooth}

  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .brand img{ width:48px; height:48px; flex:none; border-radius:12px; }

  .brand-sub{ font-size:12px; color:var(--text-2); line-height:1.3; }
  .lang-btn{

    border:1px solid var(--border); border-radius:10px;
    background:var(--panel); color:var(--text); cursor:pointer;
    font:700 13px/1 'Cairo','Segoe UI',Tahoma,Arial,sans-serif;

  }
  .lang-btn:hover{ border-color:var(--accent); color:var(--accent); }

  .picker-label{ font-size:14px; font-weight:700; color:var(--text-2); }
  .seg{ display:inline-flex; padding:5px; gap:4px; border-radius:14px; background:var(--panel); border:1px solid var(--border); box-shadow:var(--shadow); }

    font:700 15px/1 'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
    min-width:46px; padding:11px 16px; border-radius:10px;
    transition:background .15s, color .15s;

  .seg button:hover:not([aria-pressed="true"]){ color:var(--accent); }

  .plan{

  .rec-badge{

  [hidden]{ display:none !important; }

  }

  function trialCard(t) {
    var P = t.p0, href = STORE_URL ? STORE_URL + '?hl=' + lang : waUrl(P.msg);
    return '<div class="plan">' +
      '<h3 class="plan-name">' + P.name + '</h3><div class="plan-sub">' + P.sub + '</div>' +
      '<div class="price-block"><div class="price"><span class="price-num">0</span><span class="price-cur">' + t.cur + '</span></div>' +
      '<div class="price-per"><div>' + P.price + '</div><div>' + P.per + '</div></div></div>' +
      '<a class="cta alt" target="_blank" rel="noopener" href="' + href + '">' + (STORE_URL ? '' : WA) + '<span>' + (STORE_URL ? P.ctaStore : P.cta) + '</span></a>' +
      '<p class="trial-note">' + P.note + '</p>' +
      featuresHtml(t, t.trialPlus, t.freeFeats, t.featFree) +
      '</div>';
  }

  function render() {
    var t = T[lang], ar = lang === 'ar';
    document.documentElement.lang = lang;
    document.documentElement.dir = ar ? 'rtl' : 'ltr';
    document.title = t.title;

    var els = document.querySelectorAll('[data-t]');
    for (var i = 0; i < els.length; i++) els[i].textContent = t[els[i].getAttribute('data-t')];

    var btn = document.getElementById('lang-btn');
    btn.value = lang;
    btn.className = 'lang-btn' + (ar ? ' to-ar' : '');

    var seg = document.getElementById('devs');
    seg.textContent = '';
    [false, true].forEach(function (y) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = y ? X[lang].yr : X[lang].mo;
      b.setAttribute('aria-pressed', y === yearly ? 'true' : 'false');
      b.addEventListener('click', function () { yearly = y; render(); });
      seg.appendChild(b);
    });

    document.getElementById('plans').innerHTML = trialCard(t) + paidCard(t, 'b') + paidCard(t, 'p');

    document.getElementById('why').innerHTML = t.why.map(function (w) {
      return '<div class="card"><div class="plan-ico">' + w[0] + '</div><h3>' + w[1] + '</h3><p>' + w[2] + '</p></div>';
    }).join('');

    document.getElementById('faq').innerHTML = t.faq.map(function (q, i) {
      return '<details' + (i === 0 ? ' open' : '') + '><summary>' + q[0] + '</summary><div class="ans">' + q[1] + '</div></details>';
    }).join('');

    var pls = document.querySelectorAll('a[data-privacy]');
    for (var j = 0; j < pls.length; j++) pls[j].href = './?lang=' + lang;

    document.getElementById('wa-link').href = waUrl(t.waAsk);
    var pl = document.getElementById('privacy-link');
    pl.textContent = t.privacy;
    pl.href = './?lang=' + lang;
  }

  document.getElementById('lang-btn').addEventListener('change', function () {
    lang = LANGS.indexOf(this.value) >= 0 ? this.value : 'en';
    try { localStorage.setItem(KEY, lang); } catch (e) {}
    render();
  });
  render();
})();
</script>
</body>
</html>
